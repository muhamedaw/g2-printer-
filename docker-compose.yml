version: '3.8'

x-service-defaults: &service-defaults
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  restart: unless-stopped
  environment: &db-defaults
    POSTGRES_HOST: postgres
    REDIS_HOST: redis
    REDIS_PORT: "6379"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  deploy:
    resources:
      limits:
        cpus: '0.5'
        memory: 512M

services:
  # ── Infrastructure ────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: mpg2-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mpg2}
      POSTGRES_USER: ${POSTGRES_USER:-mpg2_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mpg2_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: mpg2-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --appendonly yes
      --appendfsync everysec
      --save 60 1
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 384M

  ollama:
    image: ollama/ollama:latest
    container_name: mpg2-ollama
    profiles: [ai]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

  # ── Application services ──────────────────────────────────────────────────────

  api-gateway:
    <<: *service-defaults
    container_name: mpg2-api-gateway
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    command: ["node", "dist/server.js"]
    ports:
      - "${API_PORT:-3001}:3001"

  market-data:
    <<: *service-defaults
    container_name: mpg2-market-data
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: market-data
    ports:
      - "${WEBHOOK_PORT:-3003}:3003"

  social-data:
    <<: *service-defaults
    container_name: mpg2-social-data
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: social-data

  ai-brain:
    <<: *service-defaults
    container_name: mpg2-ai-brain
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: ai-brain
    environment:
      <<: *db-defaults
      OLLAMA_HOST: http://ollama:11434

  security-engine:
    <<: *service-defaults
    container_name: mpg2-security-engine
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: security-engine

  risk-engine:
    <<: *service-defaults
    container_name: mpg2-risk-engine
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: risk-engine

  trade-engine:
    <<: *service-defaults
    container_name: mpg2-trade-engine
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: trade-engine

  notification-engine:
    <<: *service-defaults
    container_name: mpg2-notification-engine
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: notification-engine

  monetization:
    <<: *service-defaults
    container_name: mpg2-monetization
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: monetization
    ports:
      - "3002:3002"

volumes:
  postgres_data:
  redis_data:
  ollama_data:
